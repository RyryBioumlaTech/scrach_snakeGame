<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game | Ryryt</title>
    <link rel="stylesheet" href="snakeGame.css">
</head>
<body>
    <p id="resMsg">Please play it on your pc!</p>
    <div id="gameBox">
        <div id="gamePanel">
            <p>Game over</p>
            <div id="finalPoint"></div>
            <input type="button" value="retry" id="retry">
        </div>
    </div>
    <div id="interface">
        <div id="block">
            <div id="snake">
                <div id="head"></div>
            </div>
        </div>
        <div id="menu">
            <div id="count">
                point: 
                <div id="point">
                    0
                </div>
            </div>
        </div>
    </div>
    <script src="snakeGame.js"></script>
</body>
</html>
